name: Build and Release G COUNT

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          flutter create --project-name g_count --org com.example temp_project
          cp -r temp_project/android/gradlew android/gradlew
          cp -r temp_project/android/gradlew.bat android/gradlew.bat
          cp -r temp_project/android/gradle android/gradle
          cp temp_project/android/local.properties android/local.properties
          chmod +x android/gradlew
          rm -rf temp_project

      - name: Fix Gradle version
        run: |
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

      - name: Replace empty icons with real icons
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert -size 72x72 xc:#2979FF -fill white -font DejaVu-Sans-Bold \
            -pointsize 20 -gravity center -annotate 0 "G" \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 48x48 xc:#2979FF -fill white -font DejaVu-Sans-Bold \
            -pointsize 14 -gravity center -annotate 0 "G" \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -size 96x96 xc:#2979FF -fill white -font DejaVu-Sans-Bold \
            -pointsize 28 -gravity center -annotate 0 "G" \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:#2979FF -fill white -font DejaVu-Sans-Bold \
            -pointsize 40 -gravity center -annotate 0 "G" \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:#2979FF -fill white -font DejaVu-Sans-Bold \
            -pointsize 56 -gravity center -annotate 0 "G" \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Get version
        id: version
        run: echo "VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.version.outputs.VERSION }}"
          name: "G COUNT v${{ steps.version.outputs.VERSION }}"
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## G COUNT Release
            - Auto-built from latest push to main
            - Download APK below and install on Android